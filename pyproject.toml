[project]
name = "universal-adversarial-perturbation"
version = "0.1.0"
description = "Universal adversarial perturbations for fast generation and high error rate on small datasets"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Uno-Takashi", email = "euno.eng@gmail.com" }]
requires-python = ">=3.11,<3.14"
keywords = ["adversarial-examples", "deep-learning", "tensorflow", "universal-perturbation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "tensorflow>=2.16",
]

[project.urls]
Homepage = "https://github.com/Uno-Takashi/Universal-Adversarial-Perturbation-for-faster-and-higher-error-rate"
Repository = "https://github.com/Uno-Takashi/Universal-Adversarial-Perturbation-for-faster-and-higher-error-rate"

[project.optional-dependencies]
cuda = ["tensorflow[and-cuda]>=2.16"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "classifiers.py",
    "deepfool.py",
    "deeptarget.py",
    "imagenet_source.py",
    "prepare_imagenet_data.py",
    "universal_pert.py",
    "util_univ.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "*.py",
    "README.md",
    "LICENSE",
    "data/labels.txt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
