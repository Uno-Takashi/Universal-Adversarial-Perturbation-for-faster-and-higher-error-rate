name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

env:
  UV_VERSION: "0.12.5"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check that the tag matches the project version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          project_version="$(uv version --short)"
          echo "version=${project_version}" >> "$GITHUB_OUTPUT"
          if [ "${tag}" != "v${project_version}" ]; then
            echo "::error::Tag ${tag} does not match the project version v${project_version}." \
              "Bump the version in pyproject.toml or retag."
            exit 1
          fi
          echo "Releasing v${project_version}"

      - name: Run tests before releasing
        run: uv run --group dev pytest -q
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: ""

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/*

  pypi-release:
    name: Publish to PyPI
    needs: build
    # Opt in by setting the repository variable PUBLISH_TO_PYPI to "true" and configuring
    # PyPI trusted publishing for this repository and the "pypi" environment.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
